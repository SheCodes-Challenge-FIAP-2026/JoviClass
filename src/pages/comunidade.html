<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/comunidade.css">
    <link rel="shortcut icon" href="../assets/favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=Manrope:wght@200..800&display=swap"
        rel="stylesheet">
    <title>Comunidade</title>
</head>

<body>

    <!-- MENU -->
    <div class="menu">

        <div class="menu-header">

            <div class="logoJovi">

                <img src="../assets/img/logo.png" alt="logo" id="logo">

                <h2>JoviClass</h2>

            </div>

            <div class="hamburger" id="hamburger">

                <span></span>

                <span></span>

                <span></span>

            </div>

        </div>

        <div class="menu-links" id="menuLinks">

            <a href="../../index.html">Início</a>

            <a href="./materias.html">Matérias</a>

            <a href="#">Calendário</a>

        </div>

    </div>

    <!-- CONTEÚDO -->
    <div id="comunidade">

        <div class="topoComunidade">

            <div>

                <h1>Comunidades</h1>

                <p id="subtituloComunidade">
                    Participe de grupos de estudo e colabore com outros estudantes.
                </p>

            </div>

            <button type="button" onclick="abrirFormulario()" id="btnNovaComunidade">
                + Nova Comunidade
            </button>

        </div>

        <!-- FORMULÁRIO -->
        <div id="formulario">

            <form>

                <button type="button" onclick="fecharAba()" id="fechar">
                    X
                </button>

                <h2>Nova Comunidade</h2>

                <label for="nomeComunidade">
                    Nome da Comunidade:
                </label>

                <input type="text" placeholder="Ex. Cálculo" id="nomeComunidade">

                <label for="descricao">
                    Descrição:
                </label>

                <input type="text" placeholder="Descreva o objetivo da comunidade..." id="descricao">

                <label for="categoria">
                    Categoria:
                </label>

                <select id="categoria">

                    <option value="Estudo">Estudo</option>

                    <option value="Projeto">Projeto</option>

                    <option value="Discussão">Discussão</option>

                    <option value="Tutoria">Tutoria</option>

                    <option value="Social">Social</option>

                </select>

                <label for="privacidade">
                    Privacidade:
                </label>

                <select id="privacidade">

                    <option value="Pública">Pública</option>

                    <option value="Privada">Privada</option>

                </select>

                <button type="button" onclick="criarComunidade()">
                    Criar comunidade
                </button>

            </form>

        </div>

        <!-- LISTA DE COMUNIDADES -->
        <div id="listadeComunidades"></div>

        <!-- PÁGINA DA COMUNIDADE -->
        <div id="paginaComunidade">

            <div class="topoPagina">

                <div class="caminho">

                    <span onclick="voltarComunidades()" id="setaVoltar">
                        ←
                    </span>

                    <p>
                        Comunidades › <span id="NomeDiferenciado"></span>
                    </p>

                </div>

                <div>
                    <h1 id="tituloComunidade"></h1>
                    <p id="descricaoComunidade"></p>
                </div>

            </div>

            <!-- ARQUIVOS -->
            <div id="arquivoArea" class="conteudoAba">

                <h2 class="tituloArquivos">
                    📁 Arquivos
                </h2>

                <div class="uploadBox">

                    <input type="file" id="uploadArquivo">

                </div>

                <div id="listaArquivos"></div>

                <!-- CHAT -->

                <div id="chatArea">

                    <h2>💬 Chat</h2>

                    <div id="mensagensChat"></div>

                    <div class="chatInput">

                        <input type="text" id="inputMensagem" placeholder="Digite uma mensagem">

                        <button onclick="enviarMensagem()">
                            Enviar
                        </button>

                    </div>

                </div>

            </div>

        </div>

        <script src="../js/comunidade.js"></script>

</body>

</html>
