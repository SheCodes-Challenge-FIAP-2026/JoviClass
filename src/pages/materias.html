<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/materias.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
  <title>JoviClass – Matérias</title>
</head>
<body>

  <div class="menu">
    <div class="menu-header">
      <div class="logoJovi">
        <img src="../assets/img/logo.png" alt="" id="logo">
        <h2>JoviClass</h2>
      </div>
      <div class="hamburger" id="hamburger">
        <span></span><span></span><span></span>
      </div>
    </div>
    <div class="menu-links" id="menuLinks">
      <a href="../../index.html">Início</a>
      <a href="./calendario.html">Calendário</a>
      <a href="./comunidade.html">Comunidades</a>
    </div>
  </div>

  <div class="materias">
    <div class="headerMaterias">
      <div>
        <h1>Matérias</h1>
        <p>Organize suas matérias para fácil acesso</p>
      </div>
      <button id="btnMateria" type="button" onclick="abrirFormulario()">+ Nova Matéria</button>
    </div>

    <div class="cardsMaterias" id="cardsMaterias"></div>
  </div>

  <!-- Modal Nova/Renomear Matéria -->
  <div class="overlay" id="overlay">
    <div class="modal">
      <div class="topoModal">
        <p id="tituloModal">Nova Matéria</p>
        <button id="fecharModal">✕</button>
      </div>
      <div class="campo">
        <label for="nomeMateria">Nome da matéria</label>
        <input type="text" id="nomeMateria" placeholder="Ex: Matemática">
      </div>
      <div class="acoesModal">
        <button id="btnCancelar">Cancelar</button>
        <button id="btnCriarMateria">Criar Matéria</button>
      </div>
    </div>
  </div>

  <!-- Dropdown menu (3 pontinhos) -->
  <div class="dropdownMenu" id="dropdownMenu">
    <button class="dropItem" id="dropCompartilhar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
      Tornar pasta compartilhada
    </button>
    <button class="dropItem" id="dropRenomear">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      Renomear
    </button>
    <button class="dropItem dropDanger" id="dropExcluir">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
      Excluir matéria
    </button>
  </div>

  <script src="../js/materias.js"></script>
</body>
</html>
