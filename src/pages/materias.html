<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/materias.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
  <title>JoviClass – Matérias</title>
</head>
<body>

 <!-- TOPO / MENU -->
  <header class="menu">
    <div class="menu-header">
      <div class="logoJovi">
        <img src="../assets/img/logo.png" alt="Logo JoviClass" id="logo">
        <h2>JoviClass</h2>
      </div>

      <div class="menu-actions">
        <div class="notif-wrapper">
          <button class="icon-btn" id="notifBtn" aria-label="Notificações" aria-haspopup="true" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 3a6 6 0 0 0-6 6v3.586l-1.707 1.707A1 1 0 0 0 5 16h14a1 1 0 0 0 .707-1.707L18 12.586V9a6 6 0 0 0-6-6Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
              <path d="M9.5 19a2.5 2.5 0 0 0 5 0" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
            <span class="notif-dot" id="notifDot" hidden>0</span>
          </button>

          <div class="notif-panel" id="notifPanel" hidden>
            <div class="notif-panel-header">
              <strong>Notificações</strong>
              <button id="notifMarcarLidas" class="notif-marcar">Marcar todas como lidas</button>
            </div>
            <div class="notif-lista" id="notifLista">
              <!-- preenchido via script.js -->
            </div>
          </div>
        </div>

        <div class="hamburger" id="hamburger">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </div>

    <nav class="menu-links" id="menuLinks">
      <a href="../../index.html" class="ativo">Início</a>
      <a href="../pages/calendario.html">Calendário</a>
      <a href="../pages/comunidade.html">Comunidades</a>
      <a href="../pages/expansaoConhecimento.html">Expansão do Conhecimento</a>
      <a href="../pages/camera.html">Voltar a câmera ↩</a>

    </nav>
  </header>

  <div class="materias">
    <div class="headerMaterias">
      <div>
        <h1>Matérias</h1>
        <p>Organize suas matérias para fácil acesso</p>
      </div>
      <button id="btnMateria" type="button" onclick="abrirFormulario()">+ Nova Matéria</button>
    </div>

    <div class="cardsMaterias" id="cardsMaterias"></div>
  </div>

  <!-- Modal Nova/Renomear Matéria -->
  <div class="overlay" id="overlay">
    <div class="modal">
      <div class="topoModal">
        <p id="tituloModal">Nova Matéria</p>
        <button id="fecharModal">✕</button>
      </div>
      <div class="campo">
        <label for="nomeMateria">Nome da matéria</label>
        <input type="text" id="nomeMateria" placeholder="Ex: Matemática">
      </div>
      <div class="campo">
        <label>Cor da matéria</label>
        <div class="seletorCores" id="seletorCores">
          <button class="btnCor selecionada" data-cor="#1466ff" style="background:#1466ff" title="Azul"></button>
          <button class="btnCor" data-cor="#7c3aed" style="background:#7c3aed" title="Roxo"></button>
          <button class="btnCor" data-cor="#0891b2" style="background:#0891b2" title="Ciano"></button>
          <button class="btnCor" data-cor="#059669" style="background:#059669" title="Verde"></button>
          <button class="btnCor" data-cor="#d97706" style="background:#d97706" title="Amarelo"></button>
          <button class="btnCor" data-cor="#dc2626" style="background:#dc2626" title="Vermelho"></button>
          <button class="btnCor" data-cor="#db2777" style="background:#db2777" title="Rosa"></button>
          <button class="btnCor" data-cor="#ea580c" style="background:#ea580c" title="Laranja"></button>
        </div>
      </div>
      <div class="acoesModal">
        <button id="btnCancelar">Cancelar</button>
        <button id="btnCriarMateria">Criar Matéria</button>
      </div>
    </div>
  </div>

  <!-- Dropdown menu (3 pontinhos) -->
  <div class="dropdownMenu" id="dropdownMenu">
    <button class="dropItem" id="dropCompartilhar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
      Tornar pasta compartilhada
    </button>
    <button class="dropItem" id="dropRenomear">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      Renomear
    </button>
    <button class="dropItem dropDanger" id="dropExcluir">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
      Excluir matéria
    </button>
  </div>

    <!-- NAV INFERIOR (mobile) -->
  <nav class="nav-mobile">
    <a href="../../index.html" class="ativo">
      <span class="nav-icone">🏠︎</span>
      <span>Início</span>
    </a>
    <a href="../pages/materias.html">
      <span class="nav-icone">📖</span>
      <span>Matérias</span>
    </a>
    <a href="../pages/camera.html" class="nav-camera">
      <span class="nav-icone-camera">📷</span>
    </a>
    <a href="../pages/calendario.html">
      <span class="nav-icone">📝</span>
      <span>Tarefas</span>
    </a>
    <a href="../pages/perfil.html">
      <span class="nav-icone">👤</span>
      <span>Perfil</span>
    </a>
  </nav>

  <script src="../js/materias.js"></script>
</body>
</html>
