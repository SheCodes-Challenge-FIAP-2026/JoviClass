<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/paginaMateria.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
  <title>JoviClass – Matéria</title>
</head>
<body>

  <div class="menu">
    <div class="menu-header">
      <div class="logoJovi">
        <img src="../assets/img/logo.png" alt="" id="logo">
        <h2>JoviClass</h2>
      </div>
      <div class="hamburger" id="hamburger">
        <span></span><span></span><span></span>
      </div>
    </div>
    <div class="menu-links" id="menuLinks">
      <a href="../../index.html">Início</a>
      <a href="./materias.html" class="ativo">Matérias</a>
      <a href="./calendario.html">Calendário</a>
      <a href="./comunidade.html">Comunidades</a>
    </div>
  </div>

  <div class="materias">
    <div class="headerMaterias">
      <div>
        <a href="./materias.html" class="voltarBtn">← Voltar</a>
        <h1 id="tituloPagina">Matéria</h1>
      </div>
      <div class="acoesCabecalho">
        <button class="btnSecundario" id="btnCriarAnotacao">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          Criar anotações
        </button>
        <button class="btnPrimario" id="btnAddArquivo">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          Adicionar arquivo
        </button>
      </div>
    </div>

    <!-- Lista de arquivos -->
    <div class="listaArquivos" id="listaArquivos"></div>

    <p class="semArquivos" id="semArquivos">Ainda não há arquivos.</p>

    <!-- Área de anotações (oculta inicialmente) -->
    <div class="areaAnotacao" id="areaAnotacao" style="display:none">
      <div class="anotacaoHeader">
        <h2>Nova Anotação</h2>
        <button class="btnFecharAnotacao" id="btnFecharAnotacao">✕</button>
      </div>
      <input type="text" id="tituloAnotacao" class="inputAnotacao" placeholder="Título da anotação...">
      <textarea id="textoAnotacao" class="textareaAnotacao" placeholder="Escreva suas anotações aqui..."></textarea>
      <div class="acoesAnotacao">
        <button class="btnSecundario" id="btnCancelarAnotacao">Cancelar</button>
        <button class="btnPrimario" id="btnSalvarAnotacao">Salvar anotação</button>
      </div>
    </div>
  </div>

  <!-- Input de arquivo oculto -->
  <input type="file" id="inputArquivo" multiple style="display:none">

  <!-- Dropdown de arquivo (3 pontinhos) -->
  <div class="dropdownMenu" id="dropdownArquivo">
    <div class="dropHeader">Salvar como:</div>
    <button class="dropItem" data-format="pdf">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      Salvar como PDF
    </button>
    <button class="dropItem" data-format="docx">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      Salvar como DOCX
    </button>
    <button class="dropItem" data-format="txt">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      Salvar como TXT
    </button>
    <button class="dropItem" data-format="original">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Salvar no formato original
    </button>
  </div>

  <script src="../js/paginaMateria.js"></script>
</body>
</html>
